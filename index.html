<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081321" />
    <title>DeskScholar | Offline-First AI Learning Companion</title>
    <!-- Route meta (description, canonical, OG, Twitter) is managed per-route via react-helmet-async. -->
    <!-- Critical assets preloaded: hero image + primary fonts (self-hosted, no third-party requests). -->
    <link
      rel="preload"
      as="image"
      href="/assets/deskscholar/deskscholar-hero-dark.webp"
      fetchpriority="high"
      imagesrcset="/assets/deskscholar/deskscholar-hero-dark-720.webp 720w, /assets/deskscholar/deskscholar-hero-dark.webp 1407w"
      imagesizes="(min-width: 1024px) 606px, calc(100vw - 40px)"
    />
    <link rel="preload" href="/fonts/sora-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
