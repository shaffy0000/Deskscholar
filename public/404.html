<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found (404) — DeskScholar</title>
    <meta name="description" content="The page you requested does not exist. Return to the DeskScholar home page." />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background:
          radial-gradient(720px 360px at 50% -10%, rgba(23, 107, 91, 0.06), transparent 65%),
          #F7F6F2;
        color: #17211F; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
      }
      .card { max-width: 560px; display: grid; gap: 16px; justify-items: center; }
      .badge {
        display: inline-flex; align-items: center; gap: 8px; border: 1px solid #D9DDD5;
        background: #FFFFFF; color: #176B5B; border-radius: 999px; padding: 6px 14px;
        font: 600 11px/1 'Inter', system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase;
        box-shadow: 0 1px 2px rgba(23,33,31,0.05);
      }
      h1 { font-family: 'Space Grotesk', 'Sora', system-ui, sans-serif; font-size: clamp(28px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.02em; }
      p { color: #59645F; font-size: 15px; line-height: 1.65; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
      a { display: inline-flex; min-height: 44px; align-items: center; border-radius: 4px; padding: 10px 22px; font: 600 14px/1 'Inter', system-ui, sans-serif; text-decoration: none; transition: background-color 150ms ease; }
      .primary { background: #176B5B; color: #FFFFFF; }
      .primary:hover { background: #125347; }
      .ghost { border: 1px solid #D9DDD5; background: #FFFFFF; color: #17211F; }
      .ghost:hover { border-color: #176B5B; color: #176B5B; }
      a:focus-visible { outline: 2px solid #176B5B; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">404 — off the map</span>
      <h1>This page isn’t on the desk.</h1>
      <p>The page you requested doesn’t exist. DeskScholar is a prototype-stage project — some URLs are still on the way.</p>
      <div class="links">
        <a class="primary" href="/">Back to Home</a>
        <a class="ghost" href="/contact">Join the waitlist</a>
      </div>
    </main>
  </body>
</html>
